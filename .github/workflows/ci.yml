name: SnapSync AI CI

on:
  push:
    branches:
      - main
      - develop
      - Studio-Portfolio-Management
  pull_request:
    branches:
      - main
      - develop

jobs:

  backend:
    name: ASP.NET Core Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore backend/PhotographyBooking.Api/PhotographyBooking.Api.csproj

      - name: Build backend
        run: dotnet build backend/PhotographyBooking.Api/PhotographyBooking.Api.csproj --configuration Release --no-restore


  frontend:
    name: React Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/photography-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/photography-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React
        run: npm run build


  flutter:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/photography_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test


  agentic-ai:
    name: Python Agentic AI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agentic-ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agentic-ai/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest